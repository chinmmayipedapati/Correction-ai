services:
  - type: web
    name: correction-ai
    runtime: node
    plan: free
    buildCommand: unset VITE_API_BASE_URL && npm ci --prefix server && npm ci --prefix client --include=dev && npm run build --prefix client
    startCommand: node server/production.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
